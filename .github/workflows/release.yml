name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build.sh

      - name: Checksums
        working-directory: dist
        run: sha256sum pipescry-* > SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/pipescry-* dist/SHA256SUMS
